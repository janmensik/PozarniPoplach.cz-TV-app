# AndroidX support (required for all modern AndroidX dependencies)
android.useAndroidX=true

# Allow building from a path that contains non-ASCII characters in the project dir name
android.overridePathCheck=true

# Kotlin code style
kotlin.code.style=official

# Gradle JVM heap
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
